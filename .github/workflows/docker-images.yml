name: docker-images

on:
  workflow_dispatch:
    inputs:
      push_to_ghcr:
        description: "Push images to GHCR"
        required: false
        default: false
        type: boolean
      image_namespace:
        description: "Image namespace (for GHCR push), e.g. ghcr.io/mydracula"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event.inputs.push_to_ghcr == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image names
        id: vars
        shell: bash
        run: |
          namespace="${{ github.event.inputs.image_namespace }}"
          if [ -z "$namespace" ]; then
            namespace="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          fi
          namespace="${namespace%/}"
          echo "service_image=${namespace}/codex-manager-service" >> "$GITHUB_OUTPUT"
          echo "web_image=${namespace}/codex-manager-web" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.service
          push: ${{ github.event.inputs.push_to_ghcr == 'true' }}
          tags: |
            ${{ steps.vars.outputs.service_image }}:latest
            ${{ steps.vars.outputs.service_image }}:${{ steps.vars.outputs.sha_tag }}
          outputs: type=docker,dest=/tmp/codex-manager-service.tar

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: ${{ github.event.inputs.push_to_ghcr == 'true' }}
          tags: |
            ${{ steps.vars.outputs.web_image }}:latest
            ${{ steps.vars.outputs.web_image }}:${{ steps.vars.outputs.sha_tag }}
          outputs: type=docker,dest=/tmp/codex-manager-web.tar

      - name: Compress image archives
        shell: bash
        run: |
          gzip -f /tmp/codex-manager-service.tar
          gzip -f /tmp/codex-manager-web.tar

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            /tmp/codex-manager-service.tar.gz
            /tmp/codex-manager-web.tar.gz
          if-no-files-found: error
          compression-level: 0
