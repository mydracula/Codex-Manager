[package]
name = "codexmanager-core"
version.workspace = true
edition = "2021"

[dependencies]
base64 = "0.22"
rand = "0.8"
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
urlencoding = "2"
