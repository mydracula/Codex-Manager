services:
  - type: web
    name: codexmanager
    runtime: docker
    dockerContext: .
    dockerfilePath: ./docker/Dockerfile.web
    plan: free
    envVars:
      - fromGroup: codexmanager-shared
      - key: CODEXMANAGER_WEB_ADDR
        value: 0.0.0.0:48761
      - key: CODEXMANAGER_SERVICE_ADDR
        value: 127.0.0.1:48760
      - key: CODEXMANAGER_WEB_NO_OPEN
        value: "1"
      - key: CODEXMANAGER_DB_PATH
        value: /tmp/codexmanager.db

envVarGroups:
  - name: codexmanager-shared
    envVars:
      - key: CODEXMANAGER_RPC_TOKEN
        generateValue: true
